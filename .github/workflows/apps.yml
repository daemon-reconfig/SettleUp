name: Build apps

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: Chukta-android
          path: android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      # Unsigned build: install it with a sideloading tool (which signs it with your Apple ID),
      # or open ios/App in Xcode on a Mac and run it on your phone directly.
      - name: Build unsigned app
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr Chukta-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Chukta-ios
          path: Chukta-unsigned.ipa

  # Publishes the builds on the repo's Releases page so they can be downloaded directly.
  release:
    needs: [android, ios]
    # Still publish the Android build if the iOS job couldn't get a Mac runner.
    if: ${{ always() && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv out/app-debug.apk out/Chukta-android.apk
          notes="Automatic build of ${GITHUB_SHA::7}.

          - **Chukta-android.apk**: install directly on Android (allow installs from your browser or files app).
          - **Chukta-unsigned.ipa**: unsigned iPhone build. Install with a sideloading tool that signs it with your Apple ID, or build from ios/ in Xcode."
          gh release create "v0.1.${{ github.run_number }}" out/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Chukta build ${{ github.run_number }}" --notes "$notes"
